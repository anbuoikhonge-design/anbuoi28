/* ===== Header ===== */
#hd{left:190px;right:14px;top:4px;height:26px;display:flex;align-items:center;justify-content:space-between;font-size:12px}
#hd b{font-size:18px;font-weight:800;letter-spacing:2px;color:#f0cf86;margin-right:8px;text-shadow:0 0 10px #e8a93a88}
#msg{font-size:11px;color:#f6ead0;text-align:center;flex:1;padding:0 8px;opacity:.9}
#bal{background:#1a0e08;border:1px solid #c9a063;border-radius:12px;padding:3px 10px;color:#ffe08a;font-weight:700}

/* ===== Table ===== */
#panel{left:186px;top:34px;width:564px;height:156px;border-radius:26px;
  background:linear-gradient(160deg,#9c2233,#4a0d18 45%,#240609);border:2px solid #e2bd78;
  box-shadow:0 6px 20px #000b,inset 0 0 22px #0008}
.tile{position:absolute;top:12px;width:192px;height:132px;border-radius:20px;border:0;font:inherit;cursor:pointer;overflow:hidden}
#bt{left:12px;background:linear-gradient(160deg,#fbe9b4,#d6a64e 55%,#8a5f1e);box-shadow:0 0 0 2px #fff3 inset}
#bx{right:12px;background:linear-gradient(160deg,#c42a42,#6e0d1f 60%,#350510);box-shadow:0 0 0 2px #ffffff22 inset}
.tile.sel{box-shadow:0 0 0 3px #fff inset,0 0 14px #fff8}
.tile.win{box-shadow:0 0 0 4px #ffe08a inset,0 0 22px #ffd05a}
.tile h2{position:absolute;left:0;right:0;top:6px;font-size:46px;font-weight:800;letter-spacing:2px}
#bt h2{color:#5a0f1c;text-shadow:0 1px 0 #fff6}
#bx h2{color:#f5d686;text-shadow:0 0 12px #e8a93a88}
.ppl{position:absolute;left:0;right:0;top:62px;font-size:11px;opacity:.85}
#bt .ppl{color:#5a0f1c}#bx .ppl{color:#f6ead0}
.pool,.mine{position:absolute;height:24px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700}
.pool{background:#1a0608cc;color:#ffe08a;left:12px;right:12px;bottom:36px;border:1px solid #e2bd7855}
.mine{background:#0d0605;color:#e8c77a;left:12px;right:12px;bottom:8px;font-size:11px;border:1px solid #c9a063}
#circ{position:absolute;left:227px;top:6px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(#3a1a14,#0c0606);border:3px solid #e2bd78;box-shadow:0 0 14px #000a}
#cd{position:absolute;inset:0;display:grid;place-items:center;font-size:48px;font-weight:300;color:#ffe08a}
.dice{position:absolute;inset:0}
.die{position:absolute;width:34px;height:34px;border-radius:7px;background:#c4161c;box-shadow:inset 0 -3px 0 #8e0e13;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:5px}
.die i{width:6px;height:6px;border-radius:50%;background:#fff;place-self:center;opacity:0}.die i.on{opacity:1}
.die:nth-child(1){left:14px;top:22px;transform:rotate(-14deg)}
.die:nth-child(2){left:56px;top:32px;transform:rotate(12deg)}
.die:nth-child(3){left:32px;top:62px;transform:rotate(4deg)}
.bowl{position:absolute;inset:-5px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#f7e3b0,#c9984f 55%,#6b4a22);border:3px solid #f0d28f;display:grid;place-items:center;font-size:10px;color:#3a2410;text-align:center;touch-action:none;transition:transform .4s,opacity .4s}
.bowl.can{cursor:grab}.bowl.drag{transition:none;cursor:grabbing}
.bowl.lift{transform:translateY(-100px) scale(.9)!important;opacity:0;pointer-events:none}
[data-ph=bet] .bowl,[data-ph=bet] .dice{display:none}
[data-ph=cover] #cd,[data-ph=result] #cd{display:none}
#hex{position:absolute;left:234px;top:122px;width:96px;height:26px;background:#1a0608;border:1px solid #e2bd78;border-radius:13px;display:grid;place-items:center;color:#ffb347;font-size:14px;font-weight:800;letter-spacing:1px}
#hex[data-w=tai]{color:#ffe08a}#hex[data-w=xiu]{color:#ff7b8e}#hex[data-w=bao]{color:#6fd3ff}
.blink{animation:blink .25s linear 16}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ===== Win popup ===== */
#pop{position:absolute;left:186px;top:40px;width:564px;height:140px;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:20}
#pop.on{display:flex;animation:blink .25s linear 16}
#pop b{font-size:60px;font-weight:900;letter-spacing:1px}
#pop small{font-size:13px;margin-top:2px;background:#000a;padding:2px 12px;border-radius:10px}
#pop.w b{color:#ffe08a;text-shadow:0 0 14px #ffb300,0 0 30px #ff8c00,0 3px 0 #7a4a00}
#pop.w small{color:#ffe08a}
#pop.l b{color:#ff7b8e;text-shadow:0 0 10px #c8324e}
#pop.l small{color:#ff9aa8}
#coins{position:absolute;inset:0;pointer-events:none;z-index:19;overflow:hidden}
#coins span{position:absolute;top:-24px;font-size:20px;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(420px) rotate(540deg);opacity:.6}}

/* ===== Cầu ===== */
#cau{left:186px;top:196px;width:564px;height:76px;display:flex;gap:8px}
.box{background:linear-gradient(#1b0a0c,#0d0506);border:1px solid #8a6a40;border-radius:12px;padding:4px 5px;overflow:hidden}
#bead{width:336px}#line{width:220px;position:relative}
#stats{font-size:10px;display:flex;gap:8px;height:13px;align-items:center;color:#f6ead0}
#stats i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;vertical-align:-1px}
.cT{fill:#f5d27a}.cX{fill:#d8324a}.cB{fill:#52c7ff}
.last{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* ===== Controls ===== */
#chips{left:186px;top:278px;width:564px;display:flex;gap:6px}
.chip{flex:1;height:34px;border-radius:17px;border:1.5px solid #8a6a40;background:radial-gradient(#4a2a18,#1c1109);color:#f6ead0;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.chip.sel{border-color:#ffe08a;color:#ffe08a;box-shadow:0 0 10px #ffd05aaa;transform:translateY(-2px)}
#btns{left:200px;top:322px;display:flex;gap:14px}
.bt{height:42px;border-radius:21px;border:2px solid #f0d28f;font:inherit;font-size:15px;font-weight:800;color:#fff;cursor:pointer}
#allin{width:110px;background:linear-gradient(#a24fd6,#4b1a78)}
#ok{width:290px;background:linear-gradient(#f0d07e,#8a6420);color:#2a1808;letter-spacing:1px}
#no{width:110px;background:linear-gradient(#c8324e,#6a0f22)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.bowl{transition:none}.blink,#pop.on,.spark,.last{animation:none}#coins{display:none}}

 box-shadow:0 8px 28px #000d,inset 0 0 28px #000a,inset 0 0 0 5px #0006,inset 0 0 0 6px #e2bd7866,0 0 24px #e2bd7822}

.tile{transition:transform .12s}.tile:active{transform:scale(.97)}
.tile::before{content:"";position:absolute;inset:0;border-radius:20px;background:linear-gradient(180deg,#ffffff38,transparent 38%);pointer-events:none}
.tile::after{content:"";position:absolute;top:-20%;bottom:-20%;width:38%;left:-60%;background:linear-gradient(100deg,transparent,#ffffff66,transparent);transform:skewX(-20deg);animation:sweep 5s ease-in-out infinite;pointer-events:none}
#bx::after{animation-delay:2.5s}
@keyframes sweep{0%,55%{left:-60%}100%{left:130%}}

<script>
window.onerror=m=>{const e=document.getElementById('msg');if(e)e.textContent='Lỗi: '+m};
const tg=(window.Telegram&&Telegram.WebApp)||{};try{tg.ready();tg.expand()}catch(e){}
const $=s=>document.querySelector(s),f=n=>(+n).toLocaleString('en-US');
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const CH=[1e3,1e4,5e4,1e5,5e5,5e6,1e7,5e7],lab=v=>v>=1e6?v/1e6+'M':v/1e3+'K';
const die=v=>`<div class="die">${[...Array(9)].map((_,i)=>`<i class="${v&&PIPS[v].includes(i)?'on':''}"></i>`).join('')}</div>`;
const nm=d=>d[0]==d[1]&&d[1]==d[2]?'Bão':d[0]+d[1]+d[2]>=11?'Tài':'Xỉu';
const api=async(p,b)=>(await fetch(p,{method:b?'POST':'GET',headers:{'X-Init':tg.initData||'','Content-Type':'application/json'},body:b&&JSON.stringify(b)})).json();
let S=null,chip=1e3,pend={s:null,a:0},deadline=0,key='',lastId=0,errUntil=0,rot=false,sc=1,ox=0,oy=0;
let resShown=0,popT=0,fxT=0,shaking=false,dropping=false,prevPh='',lastTick=0;
let opened=false,hold={win:null,until:0},diceKey='',lastKick=0;

const st=$('#st');
function fit(){const w=innerWidth,h=innerHeight;rot=h>w;sc=rot?Math.min(h/760,w/380):Math.min(w/760,h/380);
 st.style.transform=`translate(-50%,-50%)${rot?' rotate(90deg)':''} scale(${sc})`}
addEventListener('resize',fit);fit();

CH.forEach(v=>{const b=document.createElement('button');b.className='chip';b.dataset.v=v;b.textContent=lab(v);b.onclick=()=>{chip=v;mark();addChip()};$('#chips').appendChild(b)});
const mark=()=>document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('sel',+b.dataset.v===chip));mark();
const err=m=>{errUntil=Date.now()+2200;$('#msg').textContent=m};

/* ===== Cầu: bead plate + đường điểm ===== */
function drawCau(h){
  const a=[...h].reverse(),R=6,C=30,cap=R*C,t=a.slice(-cap);
  let s=`<svg width="326" height="68" viewBox="0 0 326 68">`;
  t.forEach((d,i)=>{const n=nm(d),c=Math.floor(i/R),r=i%R,k=n==='Tài'?'cT':n==='Xỉu'?'cX':'cB';
    s+=`<circle class="${k}${i===t.length-1?' last':''}" cx="${c*10.8+5.5}" cy="${r*11+5.5}" r="4.4"/>`});
  $('#bead').innerHTML=s+'</svg>';
  const L=a.slice(-20),n=L.length;let T=0,X=0,B=0;a.forEach(d=>{const k=nm(d);k==='Tài'?T++:k==='Xỉu'?X++:B++});
  $('#stats').innerHTML=`<span><i style="background:#f5d27a"></i>Tài ${T}</span><span><i style="background:#d8324a"></i>Xỉu ${X}</span><span><i style="background:#52c7ff"></i>Bão ${B}</span>`;
  const W=208,H=48,xs=i=>n>1?i*W/(n-1):W/2,ys=v=>H-(v-3)/15*H;
  let g=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible"><line x1="0" x2="${W}" y1="${ys(10.5)}" y2="${ys(10.5)}" stroke="#8a6a40" stroke-dasharray="3 3"/>`;
  if(n)g+=`<polyline fill="none" stroke="#e2bd78" stroke-width="1.5" points="${L.map((d,i)=>xs(i)+','+ys(d[0]+d[1]+d[2])).join(' ')}"/>`;
  L.forEach((d,i)=>{const k=nm(d);g+=`<circle cx="${xs(i)}" cy="${ys(d[0]+d[1]+d[2])}" r="2.6" class="${k==='Tài'?'cT':k==='Xỉu'?'cX':'cB'}"/>`});
  $('#gr').innerHTML=g+'</svg>';
}

/* ===== Hiệu ứng lật bát: chớp kết quả ngay khi kéo bát ra ===== */

function fx(R,live){

  f.type='lowpass';f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(260,t+1);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(.32,t+.12);v.gain.exponentialRampToValueAtTime(.0001,t+1.1);
  o.connect(f);f.connect(v);v.connect(sg);o.start(t);l.start(t);o.stop(t+1.2);l.stop(t+1.2);burst(t+.05,350,.5,.9)},
 slash(){if(!ok())return;const t=ctx.currentTime,x=ctx.createBufferSource(),b=ctx.createBiquadFilter(),v=ctx.createGain();x.buffer=noise;b.type='bandpass';b.Q.value=1.6;b.frequency.setValueAtTime(1000,t);b.frequency.exponentialRampToValueAtTime(7000,t+.3);
  v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(.7,t+.15);v.gain.exponentialRampToValueAtTime(.0001,t+.38);x.connect(b);b.connect(v);v.connect(sg);x.start(t);x.stop(t+.4)},
 clang(){if(!ok())return;const t=ctx.currentTime;[81,88,96,103].forEach((m,i)=>tone(t,m,.7-i*.1,'triangle',.24/(i+1),9000,sg));burst(t,4500,.7,.12);burst(t,300,.6,.25)}
});
function set(v){on=v;$('#mus').classList.toggle('off',!v);try{localStorage.setItem('mus',v?1:0)}catch(e){}
 if(!started){if(v)start();return}
 ctx.resume();sg.gain.value=v?1:0;master.gain.cancelScheduledValues(ctx.currentTime);master.gain.linearRampToValueAtTime(v?.8:0,ctx.currentTime+(v?1:.4))}
try{if(localStorage.getItem('mus')==='0')on=false}catch(e){}
$('#mus').classList.toggle('off',!on);
$('#mus').onclick=e=>{e.stopPropagation();set(!on)};
addEventListener('pointerdown',()=>{if(!started)start();else if(ctx.state==='suspended')ctx.resume()},{passive:true});
document.addEventListener('visibilitychange',()=>{if(!ctx)return;document.hidden?ctx.suspend():ctx.resume()});
})();

/* ===== Show: tia sét – vòng xoay quanh bát – tia sáng kết quả ===== */
(()=>{
const cv=$('#show'),g=cv.getContext('2d'),SC=2,W=760,H=380,CX=470,CY=97,TAU=Math.PI*2,rnd=Math.random;
const lerp=(a,b,t)=>a+(b-a)*t,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),eio=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,eo=u=>1-Math.pow(1-u,3),ei=u=>u*u*u;
/* --- sét --- */
function jag(x1,y1,x2,y2,off,out,d){if(d===0){out.push([x2,y2]);return}const mx=(x1+x2)/2+(rnd()-.5)*off,my=(y1+y2)/2+(rnd()-.5)*off;jag(x1,y1,mx,my,off/2,out,d-1);jag(mx,my,x2,y2,off/2,out,d-1)}
function mkBolt(x1,y1,x2,y2,off,br){const pts=[[x1,y1]];jag(x1,y1,x2,y2,off,pts,5);const bs=[];
 if(br)for(let i=4;i<pts.length-4;i+=6)if(rnd()<.65){const p=pts[i];bs.push(mkBolt(p[0],p[1],p[0]+(rnd()-.5)*110,p[1]+25+rnd()*55,18,false))}return{pts,bs}}
function strokeB(b,k){g.beginPath();b.pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();b.bs.forEach(c=>{g.save();g.lineWidth*=.6;strokeB(c,k);g.restore()})}
function drawBolt(b,al,sc){g.save();g.globalCompositeOperation='lighter';g.lineJoin='round';g.lineCap='round';
 for(const[w,a,c]of[[9,.2,'#4f9bff'],[4,.55,'#a9d4ff'],[1.5,1,'#ffffff']]){g.lineWidth=w*sc;g.strokeStyle=c;g.globalAlpha=a*al;strokeB(b)}g.restore()}
const bolts=[];let flash=0,shock=[],FP=[],EM=[],rays=null;
function addBolt(x1,y1,x2,y2,life,off){bolts.push({b:mkBolt(x1,y1,x2,y2,off||70,true),life,max:life,a:[x1,y1,x2,y2,off||70]});flash=Math.max(flash,.45)}
function sky(n){for(let i=0;i<n;i++){const x=rnd()*W;addBolt(x,-5,x+(rnd()-.5)*120,110+rnd()*200,.22+rnd()*.12)}if(window.SFX&&n>0)SFX.thunder()}
function quake(){const s=$('#st');s.classList.remove('quake');void s.offsetWidth;s.classList.add('quake')}
window.SHOW={wave(big){shock.push({r:30,max:big?150:100,a:1,big})},bolts(n){sky(n)},
 burst(n,k){const pal=k==='lose'?['120,170,255','200,220,255','160,140,255']:['255,215,90','255,150,190','255,255,230','255,190,60'];
  for(let i=0;i<n;i++){const a=rnd()*TAU,v=110+rnd()*260;FP.push({x:CX,y:CY,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.7+rnd()*.7,m:1.4,s:2+rnd()*3,sp:1,c:pal[i%pal.length]})}},
 rays(k){rays={t:0,max:4,c:k==='lose'?'130,170,255':'255,214,106'}}};
/* --- vòng xoay quanh bát --- */
function drawRing(tm,inten,hot){
 const col=hot?'255,92,72':'255,214,106',sp=hot?1.8:1;
 g.save();g.translate(CX,CY);
 let gl=g.createRadialGradient(0,0,38,0,0,84);gl.addColorStop(0,`rgba(${col},0)`);gl.addColorStop(.72,`rgba(${col},${.1+.12*inten})`);gl.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gl;g.beginPath();g.arc(0,0,84,0,TAU);g.fill();
 g.globalCompositeOperation='lighter';
 g.save();g.rotate(tm*.35*sp);g.strokeStyle=`rgba(${col},.55)`;g.lineWidth=1.2;g.beginPath();g.arc(0,0,70,0,TAU);g.stroke();
 for(let i=0;i<48;i++){const a=i/48*TAU,l=i%4===0?8:4;g.strokeStyle=`rgba(${col},${i%4===0?.95:.6})`;g.lineWidth=i%4===0?1.8:1;g.beginPath();g.moveTo(Math.cos(a)*70,Math.sin(a)*70);g.lineTo(Math.cos(a)*(70+l),Math.sin(a)*(70+l));g.stroke()}g.restore();
 g.save();g.rotate(-tm*.9*sp);g.lineCap='round';
 for(let i=0;i<6;i++){const a=i/6*TAU;g.strokeStyle=`rgba(${col},.95)`;g.lineWidth=3.6;g.beginPath();g.arc(0,0,63,a,a+.78);g.stroke();
  g.fillStyle=`rgba(255,255,230,.9)`;const b=a+1.05;g.save();g.translate(Math.cos(b)*63,Math.sin(b)*63);g.rotate(b+.785);g.fillRect(-2.2,-2.2,4.4,4.4);g.restore()}g.restore();
 g.save();g.rotate(tm*1.6*sp);g.setLineDash([2,6]);g.strokeStyle=`rgba(${col},.7)`;g.lineWidth=1.4;g.beginPath();g.arc(0,0,57,0,TAU);g.stroke();g.restore();
 for(let k=0;k<3;k++){const a=tm*1.15*sp+k*TAU/3;
  for(let j=14;j>=1;j--){const aa=a-j*.045,al=(1-j/14)*.55;g.fillStyle=`rgba(${col},${al})`;g.beginPath();g.arc(Math.cos(aa)*66,Math.sin(aa)*66,3.4*(1-j/14)+.6,0,TAU);g.fill()}
  const ox=Math.cos(a)*66,oy=Math.sin(a)*66;let og=g.createRadialGradient(ox,oy,0,ox,oy,10);og.addColorStop(0,'rgba(255,255,235,1)');og.addColorStop(.35,`rgba(${col},.8)`);og.addColorStop(1,`rgba(${col},0)`);g.fillStyle=og;g.beginPath();g.arc(ox,oy,10,0,TAU);g.fill()}
 g.restore();
 if(rnd()<.18+.5*inten){const a=rnd()*TAU,a2=a+(rnd()-.5)*1.4,r2=rnd()<.5?40:66;
  const b=mkBolt(CX+Math.cos(a)*64,CY+Math.sin(a)*64,CX+Math.cos(a2)*r2,CY+Math.sin(a2)*r2,14,false);arcs.push({b,life:.09})}}
const arcs=[];
/* --- vòng lặp --- */
let last=performance.now(),nextSky=1.5,clock=0;
function frame(now){requestAnimationFrame(frame);
 const dt=Math.min(.05,(now-last)/1000);last=now;
 const act=!S||S.phase==='bet';
 g.setTransform(SC,0,0,SC,0,0);g.clearRect(0,0,W,H);g.globalAlpha=1;
 /* tia sáng toả ra khi có kết quả (4 giây) */
 if(rays){rays.t+=dt;if(rays.t>=rays.max)rays=null;else{const u=rays.t/rays.max,al=(u<.1?u/.1:1-(u-.1)/.9)*.3;
  g.save();g.translate(CX,CY);g.globalCompositeOperation='lighter';g.rotate(rays.t*.45);
  for(let i=0;i<14;i++){g.rotate(TAU/14);const gr=g.createLinearGradient(0,0,0,-130);gr.addColorStop(0,`rgba(${rays.c},${al})`);gr.addColorStop(1,`rgba(${rays.c},0)`);
   g.fillStyle=gr;g.beginPath();g.moveTo(-3,0);g.lineTo(3,0);g.lineTo(13,-130);g.lineTo(-13,-130);g.closePath();g.fill()}
  g.restore()}}
 /* tia lửa */
 g.save();g.globalCompositeOperation='lighter';
 for(let i=FP.length-1;i>=0;i--){const p=FP[i];p.l-=dt;if(p.l<=0){FP.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy=p.vy*.96+30*dt;
  const k=cl(p.l/p.m,0,1),r=p.s*(k+.3);
  g.fillStyle=`rgba(${p.c||'255,215,90'},${k*.85})`;g.beginPath();g.arc(p.x,p.y,r,0,TAU);g.fill()}
 g.restore();
 /* sét */
 clock+=dt;if(clock>nextSky&&act){clock=0;nextSky=1.8+rnd()*2.8;sky(rnd()<.35?2:1)}
 for(let i=bolts.length-1;i>=0;i--){const b=bolts[i];b.life-=dt;if(b.life<=0){bolts.splice(i,1);continue}
  if(rnd()<.45)b.b=mkBolt(b.a[0],b.a[1],b.a[2],b.a[3],b.a[4],true);drawBolt(b.b,cl(b.life/b.max*1.6,0,1)*(.7+rnd()*.3),1)}
 /* vòng xoay */
 const left=S?(deadline-Date.now())/1000:99;
 const hot=S&&S.phase==='bet'&&left>0&&left<=5;
 const inten=S?(S.phase==='cover'?1.2:hot?1:.25):.25;
 drawRing(performance.now()/1000,inten+(window.__shk?1.6:0),hot);
 for(let i=arcs.length-1;i>=0;i--){const a=arcs[i];a.life-=dt;if(a.life<=0){arcs.splice(i,1);continue}drawBolt(a.b,1,.6)}
 for(let i=shock.length-1;i>=0;i--){const s=shock[i];s.r+=(s.big?260:180)*dt;s.a=1-(s.r-30)/(s.max-30);if(s.a<=0){shock.splice(i,1);continue}
  g.save();g.globalCompositeOperation='lighter';g.strokeStyle=`rgba(255,220,120,${s.a*.8})`;g.lineWidth=s.big?4:2.5;g.beginPath();g.arc(CX,CY,s.r,0,TAU);g.stroke();g.strokeStyle=`rgba(120,190,255,${s.a*.5})`;g.lineWidth=1.5;g.beginPath();g.arc(CX,CY,s.r-5,0,TAU);g.stroke();g.restore()}
 /* than lửa bay lên */
 if(EM.length<26&&rnd()<.35)EM.push({x:rnd()*W,y:H+5,vy:-(25+rnd()*45),s:.8+rnd()*1.8,ph:rnd()*6,l:1});
 g.save();g.globalCompositeOperation='lighter';for(let i=EM.length-1;i>=0;i--){const e=EM[i];e.y+=e.vy*dt;e.x+=Math.sin(now/500+e.ph)*.4;e.l-=dt*.14;if(e.y<-5||e.l<=0){EM.splice(i,1);continue}g.fillStyle=`rgba(255,${120+Math.floor(e.l*90)},40,${e.l*.8})`;g.beginPath();g.arc(e.x,e.y,e.s,0,TAU);g.fill()}g.restore();
 if(flash>0){g.fillStyle=`rgba(205,228,255,${Math.min(.5,flash)*.55})`;g.fillRect(0,0,W,H);flash=Math.max(0,flash-dt*2.2)}
}
requestAnimationFrame(frame);
})();
